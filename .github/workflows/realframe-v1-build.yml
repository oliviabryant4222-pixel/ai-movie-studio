name: Build RealFrame AI Studio v1
on:
  push:
    branches: ["realframe-studio-v1"]
    paths:
      - "realframe/**"
      - ".github/workflows/realframe-v1-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK 35 + Build Tools (using runner preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Run 25 Python integration tests
        working-directory: realframe
        run: python3 -m unittest discover -s tests -v
      - name: Preflight
        working-directory: realframe
        run: python3 tools/preflight.py
      - name: Build debug APK
        working-directory: realframe/android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s realframe/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose realframe/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RealFrameStudio-v1-debug-apk
          path: realframe/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
