name: Build RealFrame AI Studio v2.1
on:
  workflow_dispatch:
  push:
    branches: [realframe-studio-v21]
    paths:
      - 'realframe/**'
      - '.github/workflows/realframe-v21-build.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Run Python/FFmpeg utility tests
        working-directory: realframe
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 -m unittest discover -s tests -v
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile + run native Java media header tests
        working-directory: realframe
        run: |
          mkdir -p /tmp/realframe-header-tests
          javac -d /tmp/realframe-header-tests android/app/src/main/java/studio/realframe/MediaSignature.java tests/TestMediaSignature.java
          java -cp /tmp/realframe-header-tests TestMediaSignature
      - name: Verify Hybrid routing privacy contract (pure Java)
        working-directory: realframe
        run: |
          mkdir -p /tmp/realframe-hybrid-policy-tests
          javac -d /tmp/realframe-hybrid-policy-tests android/app/src/main/java/studio/realframe/HybridRoutePolicy.java tests/TestHybridRoutePolicy.java
          java -cp /tmp/realframe-hybrid-policy-tests TestHybridRoutePolicy
      - name: Local API authentication and request guard tests (pure Java)
        working-directory: realframe
        run: |
          mkdir -p /tmp/realframe-local-api-tests
          javac -d /tmp/realframe-local-api-tests android/app/src/main/java/studio/realframe/LocalApiSecurity.java tests/TestLocalApiSecurity.java
          java -cp /tmp/realframe-local-api-tests TestLocalApiSecurity
      - name: Checkpoint container validation tests (pure Java)
        working-directory: realframe
        run: |
          mkdir -p /tmp/realframe-model-inspector-tests
          javac -d /tmp/realframe-model-inspector-tests android/app/src/main/java/studio/realframe/ModelFileInspector.java tests/TestModelFileInspector.java
          java -cp /tmp/realframe-model-inspector-tests TestModelFileInspector
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use runner's preinstalled Android SDK and ensure API 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch pinned MIT-licensed native diffusion engine
        run: |
          bash realframe/tools/fetch_native_engine.sh
      - name: Source/configuration preflight
        working-directory: realframe
        run: python3 tools/preflight.py
      - name: Assemble debug APK
        working-directory: realframe/android
        run: gradle --no-daemon --stacktrace assembleDebug -Dorg.gradle.workers.max=2
      - name: Check APK package signature and metadata
        run: |
          test -s realframe/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose realframe/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging realframe/android/app/build/outputs/apk/debug/app-debug.apk | head -n 15
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealFrameStudio-v2_0-inapp-ai-debug-apk
          path: realframe/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
