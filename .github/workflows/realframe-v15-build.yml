name: Build RealFrame AI Studio v1.5
on:
  workflow_dispatch:
  push:
    branches: [realframe-studio-v15]
    paths:
      - 'realframe/**'
      - '.github/workflows/realframe-v15-build.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run Python/FFmpeg utility tests
        working-directory: realframe
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 -m unittest discover -s tests -v
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile + run native Java media header tests
        working-directory: realframe
        run: |
          mkdir -p /tmp/realframe-header-tests
          javac -d /tmp/realframe-header-tests android/app/src/main/java/studio/realframe/MediaSignature.java tests/TestMediaSignature.java
          java -cp /tmp/realframe-header-tests TestMediaSignature
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use runner's preinstalled Android SDK and ensure API 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Source/configuration preflight
        working-directory: realframe
        run: python3 tools/preflight.py
      - name: Assemble debug APK
        working-directory: realframe/android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check APK package signature and metadata
        run: |
          test -s realframe/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose realframe/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging realframe/android/app/build/outputs/apk/debug/app-debug.apk | head -n 15
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealFrameStudio-v1_5-inapp-ai-debug-apk
          path: realframe/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
